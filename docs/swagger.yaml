basePath: /
definitions:
  dto.AddressSuggestion:
    properties:
      lat:
        type: number
      lon:
        type: number
      value:
        type: string
    type: object
  dto.ChatResponse:
    properties:
      id:
        type: integer
      last_message_text:
        type: string
      meetup_id:
        type: integer
      title:
        type: string
      type:
        type: string
      unread_count:
        type: integer
    type: object
  dto.Coordinates:
    properties:
      lat:
        type: number
      lng:
        type: number
    type: object
  dto.CreateMeetupRequest:
    properties:
      address:
        type: string
      coordinates:
        allOf:
        - $ref: '#/definitions/dto.Coordinates'
        description: Вложенный JSON
      cover_file_id:
        type: string
      description:
        type: string
      end_time:
        type: string
      is_public:
        type: boolean
      start_time:
        type: string
      tags:
        items:
          type: integer
        type: array
      title:
        type: string
    type: object
  dto.MeetupResponse:
    properties:
      address:
        type: string
      coordinates:
        $ref: '#/definitions/dto.Coordinates'
      cover_url:
        type: string
      creator_id:
        type: integer
      description:
        type: string
      distance_meters:
        type: integer
      end_time:
        type: string
      id:
        type: integer
      is_member:
        type: boolean
      participants_count:
        type: integer
      start_time:
        type: string
      tags:
        items:
          $ref: '#/definitions/dto.TagResponse'
        type: array
      title:
        type: string
    type: object
  dto.MessageResponse:
    properties:
      chat_id:
        type: integer
      content:
        type: string
      created_at:
        type: string
      id:
        type: integer
      message_type:
        type: string
      sender_id:
        type: integer
    type: object
  dto.ProfileResponse:
    properties:
      avatar_url:
        type: string
      bio:
        type: string
      id:
        type: integer
      is_organizer:
        type: boolean
      nickname:
        type: string
      tags:
        items:
          $ref: '#/definitions/dto.TagResponse'
        type: array
      user_id:
        type: integer
    type: object
  dto.TagResponse:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  dto.UpdateMeetupRequest:
    properties:
      address:
        type: string
      coordinates:
        $ref: '#/definitions/dto.Coordinates'
      cover_file_id:
        type: string
      description:
        type: string
      end_time:
        type: string
      is_public:
        type: boolean
      start_time:
        type: string
      tags:
        items:
          type: integer
        type: array
      title:
        type: string
    type: object
  dto.UpdateProfileRequest:
    properties:
      avatar_file_id:
        type: string
      bio:
        type: string
      nickname:
        type: string
      tags:
        items:
          type: integer
        type: array
    type: object
  handler.SendMessageRequest:
    properties:
      content:
        example: Привет, как дела?
        type: string
    type: object
  handler.googleLoginRequest:
    properties:
      token:
        type: string
    type: object
  response.ErrorResponse:
    properties:
      error:
        type: string
    type: object
info:
  contact: {}
  description: API Server for Mobile Application "Meetuper"
  title: Offline Meetup API
  version: "1.0"
paths:
  /v1/auth/google:
    post:
      consumes:
      - application/json
      description: Принимает ID Token от Google SDK, возвращает JWT.
      parameters:
      - description: Google ID Token
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/handler.googleLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Вход через Google
      tags:
      - Auth
  /v1/auth/me:
    get:
      description: Возвращает ID, email, роль и статус.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Получить данные моего аккаунта
      tags:
      - Auth
  /v1/auth/telegram/callback:
    get:
      description: Принимает GET параметры от Telegram, валидирует, логинит и редиректит
        в приложение с токеном.
      responses: {}
      summary: Callback для виджета Telegram
      tags:
      - Auth
  /v1/auth/telegram/login:
    get:
      description: Возвращает HTML-страницу с Telegram Login Widget для авторизации
        пользователя через Telegram
      produces:
      - text/html
      responses:
        "200":
          description: HTML page with Telegram login widget
          schema:
            type: string
      summary: Вход через Telegram
      tags:
      - Auth
  /v1/chats:
    get:
      description: Возвращает список всех чатов (групповых и личных), в которых состоит
        текущий авторизованный пользователь. Отсортированы по активности (чаты с новыми
        сообщениями — сверху). Включает текст последнего сообщения и счетчик непрочитанных.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.ChatResponse'
            type: array
        "401":
          description: Не авторизован
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Список чатов пользователя
      tags:
      - Chats
  /v1/chats/{id}/messages:
    get:
      description: Возвращает историю сообщений для конкретного чата. Поддерживает
        cursor-based пагинацию. Пользователь должен быть участником чата.
      parameters:
      - description: ID чата
        in: path
        name: id
        required: true
        type: integer
      - description: ID последнего полученного сообщения (для пагинации, по умолчанию
          0)
        in: query
        name: cursor
        type: integer
      - description: Лимит сообщений (по умолчанию 50, максимум 100)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.MessageResponse'
            type: array
        "400":
          description: Неверный ID чата или параметры
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Не авторизован
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Получение сообщений чата
      tags:
      - Chats
    post:
      consumes:
      - application/json
      description: Сохраняет новое сообщение в базу и моментально рассылает его онлайн-участникам
        чата через WebSockets.
      parameters:
      - description: ID чата
        in: path
        name: id
        required: true
        type: integer
      - description: Текст сообщения
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.SendMessageRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.MessageResponse'
        "400":
          description: Неверный формат запроса
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Не авторизован
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Отправка сообщения
      tags:
      - Chats
  /v1/files/upload:
    post:
      consumes:
      - multipart/form-data
      parameters:
      - description: Файл
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Загрузить файл
      tags:
      - Files
  /v1/geo/suggest:
    get:
      description: Ищет адреса и возвращает координаты
      parameters:
      - description: 'Часть адреса (например: москва лен)'
        in: query
        name: address_part
        type: string
      - description: Широта
        in: query
        name: lat
        type: string
      - description: Долгота
        in: query
        name: lon
        type: string
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.AddressSuggestion'
            type: array
      security:
      - BearerAuth: []
      summary: Подсказки адресов (DaData)
      tags:
      - Geo
  /v1/meetups:
    get:
      description: Возвращает список митапов. Если переданы lat/lng/radius — ищет
        ближайшие. Иначе сортирует по времени.
      parameters:
      - description: Широта (Latitude)
        in: query
        name: lat
        type: number
      - description: Долгота (Longitude)
        in: query
        name: lng
        type: number
      - description: Радиус поиска (в метрах)
        in: query
        name: radius
        type: integer
      - description: 'Лимит записей (default: 20)'
        in: query
        name: limit
        type: integer
      - description: Смещение (pagination)
        in: query
        name: offset
        type: integer
      - description: 'ID тегов через запятую (например: 1,2,5)'
        in: query
        name: tags
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.MeetupResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Поиск и список митапов
      tags:
      - Meetups
    post:
      consumes:
      - application/json
      parameters:
      - description: Данные митапа
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/dto.CreateMeetupRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Создать митап
      tags:
      - Meetups
  /v1/meetups/{id}:
    delete:
      description: Удаляет митап (Soft Delete). Требует прав создателя (owner).
      parameters:
      - description: Meetup ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Удалить митап
      tags:
      - Meetups
    get:
      description: Возвращает детальную информацию о митапе.
      parameters:
      - description: Meetup ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.MeetupResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Получить митап по ID
      tags:
      - Meetups
    put:
      consumes:
      - application/json
      description: Частичное обновление полей митапа. Требует прав создателя (owner).
      parameters:
      - description: Meetup ID
        in: path
        name: id
        required: true
        type: integer
      - description: Поля для обновления (nil поля игнорируются)
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateMeetupRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.MeetupResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Обновить митап
      tags:
      - Meetups
  /v1/meetups/{id}/join:
    post:
      description: Добавляет текущего пользователя в список участников митапа.
      parameters:
      - description: Meetup ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Сообщение об успехе или пустой JSON
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Митап не найден
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "409":
          description: Уже участник
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Вступить в митап
      tags:
      - Meetups
  /v1/meetups/{id}/leave:
    post:
      description: Удаляет текущего пользователя из участников.
      parameters:
      - description: Meetup ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Покинуть митап
      tags:
      - Meetups
  /v1/meetups/my:
    get:
      description: Возвращает митапы текущего пользователя. По умолчанию (или filter=joined)
        — куда записан. Если filter=created — которые организовал.
      parameters:
      - description: 'Фильтр роли: ''joined'' (участник) или ''created'' (организатор)'
        enum:
        - joined
        - created
        in: query
        name: filter
        type: string
      - description: 'Лимит записей (default: 20)'
        in: query
        name: limit
        type: integer
      - description: Смещение (pagination)
        in: query
        name: offset
        type: integer
      - description: Показать посещенные митапы (прошедшие)
        in: query
        name: show_past
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.MeetupResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Мои митапы
      tags:
      - Meetups
  /v1/profile:
    get:
      description: Возвращает профиль текущего пользователя вместе с тегами.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ProfileResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Получить мой профиль
      tags:
      - Profile
    put:
      consumes:
      - application/json
      description: Обновляет никнейм, био, аватар и теги (передавать ID тегов).
      parameters:
      - description: Данные для обновления профиля
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ProfileResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Обновить мой профиль
      tags:
      - Profile
  /v1/tags:
    get:
      description: Возвращает справочник всех доступных тегов/интересов.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.TagResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Получить список тегов
      tags:
      - Tags
securityDefinitions:
  BearerAuth:
    description: 'Введите токен в формате: Bearer <your-token>'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
