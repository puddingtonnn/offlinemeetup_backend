basePath: /
definitions:
  dto.Coordinates:
    properties:
      lat:
        type: number
      lng:
        type: number
    type: object
  dto.CreateMeetupRequest:
    properties:
      address:
        type: string
      coordinates:
        allOf:
        - $ref: '#/definitions/dto.Coordinates'
        description: Вложенный JSON
      description:
        type: string
      end_time:
        type: string
      is_public:
        type: boolean
      start_time:
        type: string
      tags:
        items:
          type: integer
        type: array
      title:
        type: string
    type: object
  dto.MeetupResponse:
    properties:
      address:
        type: string
      coordinates:
        $ref: '#/definitions/dto.Coordinates'
      creator_id:
        type: integer
      description:
        type: string
      end_time:
        type: string
      id:
        type: integer
      start_time:
        type: string
      tags:
        items:
          $ref: '#/definitions/dto.TagResponse'
        type: array
      title:
        type: string
    type: object
  dto.ProfileResponse:
    properties:
      avatar_url:
        type: string
      bio:
        type: string
      id:
        type: integer
      is_organizer:
        type: boolean
      nickname:
        type: string
      tags:
        items:
          $ref: '#/definitions/dto.TagResponse'
        type: array
      user_id:
        type: integer
    type: object
  dto.TagResponse:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  dto.UpdateMeetupRequest:
    properties:
      address:
        type: string
      coordinates:
        $ref: '#/definitions/dto.Coordinates'
      description:
        type: string
      end_time:
        type: string
      is_public:
        type: boolean
      start_time:
        type: string
      tags:
        items:
          type: integer
        type: array
      title:
        type: string
    type: object
  dto.UpdateProfileRequest:
    properties:
      avatar_url:
        type: string
      bio:
        type: string
      nickname:
        type: string
      tags:
        items:
          type: integer
        type: array
    type: object
  handler.googleLoginRequest:
    properties:
      token:
        type: string
    type: object
  response.ErrorResponse:
    properties:
      error:
        type: string
    type: object
info:
  contact: {}
  description: API Server for Mobile Application "Meetuper"
  title: Offline Meetup API
  version: "1.0"
paths:
  /v1/auth/google:
    post:
      consumes:
      - application/json
      description: Принимает ID Token от Google SDK, возвращает JWT.
      parameters:
      - description: Google ID Token
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/handler.googleLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Вход через Google
      tags:
      - Auth
  /v1/auth/me:
    get:
      description: Возвращает ID, email, роль и статус.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Получить данные моего аккаунта
      tags:
      - Auth
  /v1/auth/telegram/callback:
    get:
      description: Принимает GET параметры от Telegram, валидирует, логинит и редиректит
        в приложение с токеном.
      responses: {}
      summary: Callback для виджета Telegram
      tags:
      - Auth
  /v1/auth/telegram/login:
    get:
      description: Возвращает HTML-страницу с Telegram Login Widget для авторизации
        пользователя через Telegram
      produces:
      - text/html
      responses:
        "200":
          description: HTML page with Telegram login widget
          schema:
            type: string
      summary: Вход через Telegram
      tags:
      - Auth
  /v1/meetups:
    get:
      description: Возвращает список митапов. Если переданы lat/lng/radius — ищет
        ближайшие. Иначе сортирует по времени.
      parameters:
      - description: Широта (Latitude)
        in: query
        name: lat
        type: number
      - description: Долгота (Longitude)
        in: query
        name: lng
        type: number
      - description: Радиус поиска (в метрах)
        in: query
        name: radius
        type: integer
      - description: 'Лимит записей (default: 20)'
        in: query
        name: limit
        type: integer
      - description: Смещение (pagination)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.MeetupResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Поиск и список митапов
      tags:
      - Meetups
    post:
      consumes:
      - application/json
      parameters:
      - description: Данные митапа
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/dto.CreateMeetupRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Создать митап
      tags:
      - Meetups
  /v1/meetups/{id}:
    delete:
      description: Удаляет митап (Soft Delete). Требует прав создателя (owner).
      parameters:
      - description: Meetup ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Удалить митап
      tags:
      - Meetups
    get:
      description: Возвращает детальную информацию о митапе.
      parameters:
      - description: Meetup ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.MeetupResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Получить митап по ID
      tags:
      - Meetups
    put:
      consumes:
      - application/json
      description: Частичное обновление полей митапа. Требует прав создателя (owner).
      parameters:
      - description: Meetup ID
        in: path
        name: id
        required: true
        type: integer
      - description: Поля для обновления (nil поля игнорируются)
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateMeetupRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.MeetupResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Обновить митап
      tags:
      - Meetups
  /v1/profile:
    get:
      description: Возвращает профиль текущего пользователя вместе с тегами.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ProfileResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Получить мой профиль
      tags:
      - Profile
    put:
      consumes:
      - application/json
      description: Обновляет никнейм, био, аватар и теги (передавать ID тегов).
      parameters:
      - description: Данные для обновления профиля
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ProfileResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Обновить мой профиль
      tags:
      - Profile
  /v1/tags:
    get:
      description: Возвращает справочник всех доступных тегов/интересов.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.TagResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Получить список тегов
      tags:
      - Tags
securityDefinitions:
  BearerAuth:
    description: 'Введите токен в формате: Bearer <your-token>'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
