services:
  meetuper_db:
    image: postgis/postgis:16-3.4-alpine
    restart: always
    env_file:
      - .env
    volumes:
      - ./.data/pg/mount:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  meetuper_redis:
    image: redis:alpine
    restart: always
    ports:
      - "6379:6379"

  meetuper_backend:
    build: .
    restart: always
    depends_on:
      meetuper_db:
        condition: service_healthy
      meetuper_redis:
        condition: service_started
    env_file:
      - .env
    ports:
      - "9090:9090"

  meetuper_dbeaver:
    image: dbeaver/cloudbeaver:latest
    restart: always
    volumes:
      - ./.data/cloudbeaver:/opt/cloudbeaver/workspace
    ports:
      - "8978:8978"

  minio:
    image: minio/minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    volumes:
      - ./.data/minio:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"

  minio_init:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-minioadmin} ${S3_SECRET_KEY:-minioadmin}) do echo '...waiting...' && sleep 1; done;
      /usr/bin/mc mb --ignore-existing local/${S3_BUCKET:-meetuper};
      /usr/bin/mc anonymous set public local/${S3_BUCKET:-meetuper};
      exit 0;
      "

networks:
  default:
