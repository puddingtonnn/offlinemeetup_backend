services:
  meetuper_db:
    image: postgis/postgis:16-3.4-alpine
    restart: always
    env_file:
      - .env
#    ports:
#      - "5432:5432"
    volumes:
      - ./.data/pg/mount:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  meetuper_redis:
    image: redis:alpine
    restart: always
#    ports:
#      - "6379:6379"

  meetuper_backend:
    image: ghcr.io/puddingtonnn/offlinemeetup_backend:latest
    restart: always
    depends_on:
      meetuper_db:
        condition: service_healthy
      meetuper_redis:
        condition: service_started
    ports:
      - "${APP_PORT}:${APP_PORT}"
    env_file:
      - .env
