services:
  meetuper_db:
    image: postgis/postgis:16-3.4-alpine
    restart: always
    env_file:
      - .env
    volumes:
      - ./.data/pg/mount:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - default

  meetuper_redis:
    image: redis:alpine
    restart: always

  meetuper_backend:
    image: puddington/meetuper:latest
    restart: always
    depends_on:
      meetuper_db:
        condition: service_healthy
      meetuper_redis:
        condition: service_started
    env_file:
      - .env

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.meetuper.rule=Host(`api.meetuper.site`)"
      - "traefik.http.routers.meetuper.entrypoints=websecure"
      - "traefik.http.routers.meetuper.tls.certresolver=myresolver"
      - "traefik.http.services.meetuper.loadbalancer.server.port=9090"

    networks:
      - default
      - web

  meetuper_dbeaver:
    image: dbeaver/cloudbeaver:latest
    restart: always
    volumes:
      - ./.data/cloudbeaver:/opt/cloudbeaver/workspace
    networks:
      - default
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.cloudbeaver.rule=Host(`db.meetuper.site`)"
      - "traefik.http.routers.cloudbeaver.entrypoints=websecure"
      - "traefik.http.routers.cloudbeaver.tls.certresolver=myresolver"
      - "traefik.http.services.cloudbeaver.loadbalancer.server.port=8978"

  minio:
    image: minio/minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    volumes:
      - ./.data/minio:/data
    command: server /data --console-address ":9001"
    networks:
      - default
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"

      - "traefik.http.routers.minio.rule=Host(`s3.meetuper.site`)"
      - "traefik.http.routers.minio.entrypoints=websecure"
      - "traefik.http.routers.minio.tls.certresolver=myresolver"
      - "traefik.http.routers.minio.service=minio-api"
      - "traefik.http.services.minio-api.loadbalancer.server.port=9000"

      - "traefik.http.routers.minio-console.rule=Host(`console.s3.meetuper.site`)"
      - "traefik.http.routers.minio-console.entrypoints=websecure"
      - "traefik.http.routers.minio-console.tls.certresolver=myresolver"
      - "traefik.http.routers.minio-console.service=minio-console"
      - "traefik.http.services.minio-console.loadbalancer.server.port=9001"

  minio_init:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-minioadmin} ${S3_SECRET_KEY:-minioadmin}) do echo '...waiting...' && sleep 1; done;
      /usr/bin/mc mb --ignore-existing local/${S3_BUCKET:-meetuper};
      /usr/bin/mc anonymous set public local/${S3_BUCKET:-meetuper};
      exit 0;
      "
    networks:
      - default

networks:
  web:
    external: true
